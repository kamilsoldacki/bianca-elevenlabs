<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Wybierz głos Bianci i sprawdź, jak brzmi w rozmowie."
    />
    <title>Bianca — tester głosów</title>
    <meta name="theme-color" content="#f7f5f2" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap"
    />
  </head>
  <body>
    <div class="app-shell">
      <main class="main-content" id="rozmowa">
        <header class="hero">
          <h1>Tester głosów Bianci</h1>
          <p>Wybierz głos, zacznij rozmowę i posłuchaj, jak brzmi.</p>
        </header>

        <div class="workspace">
          <section class="card conversation-card" aria-labelledby="call-heading">
            <div class="section-heading">
              <div>
                <h2 id="call-heading">Rozmowa</h2>
              </div>
              <span class="status-pill">
                <span class="status-dot" aria-hidden="true"></span>
                Gotowy
              </span>
            </div>

            <div class="call-surface" data-state="idle">
              <div class="call-visual" aria-hidden="true">
                <div class="call-ring"></div>
                <div class="call-ring call-ring-secondary"></div>
                <div class="headphone">
                  <svg viewBox="0 0 64 64" fill="none">
                    <path d="M12 29c0-11 9-20 20-20s20 9 20 20" />
                    <rect x="7" y="28" width="13" height="22" rx="5" />
                    <rect x="44" y="28" width="13" height="22" rx="5" />
                  </svg>
                </div>
              </div>
              <p class="call-label" id="callLabel">Gotowy</p>
              <p class="call-sub" id="modeLine">
                Na start przeglądarka poprosi o mikrofon.
              </p>
              <div class="call-actions">
                <button type="button" id="startBtn" class="btn btn-primary">
                  <span class="btn-icon" aria-hidden="true"></span>
                  Zacznij
                </button>
                <button type="button" id="stopBtn" class="btn btn-ghost" disabled>
                  Zakończ
                </button>
              </div>
            </div>

            <dl class="metrics" aria-label="Stan sesji">
              <div>
                <dt>Połączenie</dt>
                <dd id="connStatus">Rozłączono</dd>
              </div>
              <div>
                <dt>Tryb</dt>
                <dd id="modeStatus">—</dd>
              </div>
            </dl>
            <p id="errorBox" class="error" role="alert" hidden></p>
          </section>

          <aside class="settings-column" id="glos" aria-label="Wybór głosu">
            <section class="card voice-card" aria-labelledby="voice-heading">
              <div class="section-heading compact">
                <div>
                  <h2 id="voice-heading">Głos</h2>
                </div>
              </div>
              <p class="field-hint">Głos zmienisz przed rozmową.</p>
              <label class="select-wrap">
                <span>Głos</span>
                <select id="voiceSelect" class="select"></select>
              </label>
            </section>
          </aside>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
